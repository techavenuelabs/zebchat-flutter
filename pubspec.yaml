name: zebchat_flutter
description: >-
  ZebChat live chat for Flutter apps: in-app chat, user identity, screen views, unread count
  and push notifications. Wraps the native ZebChat Android and iOS SDKs.
version: 1.0.0
homepage: https://www.zebchat.com
documentation: https://www.zebchat.com/docs/mobile-sdk
repository: https://github.com/techavenuelabs/zebchat-flutter
issue_tracker: https://github.com/techavenuelabs/zebchat-flutter/issues
topics:
  - chat
  - live-chat
  - customer-support
  - messaging
  - push-notifications

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  plugin:
    platforms:
      android:
        package: com.zebchat.flutter
        pluginClass: ZebChatPlugin
      ios:
        pluginClass: ZebChatPlugin
